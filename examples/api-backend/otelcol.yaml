# OTel Collector do tenant fazendo dual-export (#35): recebe o OTLP do app e
# manda o mesmo dado para o backend próprio e para o coletor do stellytics.
#
# Variáveis: STELLYTICS_OTLP_ENDPOINT (ex.: https://otlp.<dominio-do-stellytics>) e
# STELLYTICS_INGEST_KEY (ntf_..., criada em /services no portal).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # Fica no lugar do APM do tenant (Jaeger, Tempo, Prometheus, um SaaS...).
  debug:
    verbosity: basic
  # Coletor do stellytics.
  otlp_http/stellytics:
    endpoint: ${env:STELLYTICS_OTLP_ENDPOINT}
    headers:
      Authorization: Bearer ${env:STELLYTICS_INGEST_KEY}

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp_http/stellytics]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp_http/stellytics]
