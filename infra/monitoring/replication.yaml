# Override opt-in para monitorar a replicação na rede privada de HA.
services:
  replication-monitor:
    image: ${REPLICATION_MONITOR_IMAGE:?}
    environment:
      PGHOST: ${REPLICATION_MONITOR_DB_HOST:?}
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: stellytics_replication_monitor
      PGPASSWORD: ${REPLICATION_MONITOR_PASSWORD:?}
      PGSSLMODE: disable
      REPLICATION_SLOT: ${REPLICATION_SLOT:-stellytics_standby}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
