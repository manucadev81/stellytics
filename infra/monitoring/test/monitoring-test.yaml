# Só para o teste do monitoramento (test/monitoring-test.sh e o job
# `monitoring` do CI): um alvo que o teste derruba, o Mailpit no lugar do SMTP
# e um receptor do sinal de vida. Nunca use em produção.
services:
  target:
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    command: ["caddy", "respond", "--listen", ":8080", "ok"]

  deadman:
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    command: ["caddy", "respond", "--listen", ":8080", "--access-log", "pong"]

  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${MAILPIT_TEST_PORT:-18025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  replication-db:
    image: postgres:17.11-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=5", "-c", "hba_file=/test/pg_hba.conf"]
    volumes:
      - ${MONITOR_TEST_WORK:?}/replication-hba.conf:/test/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30

  replication-standby:
    image: postgres:17.11-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /var/lib/postgresql/data
        chown postgres:postgres /var/lib/postgresql/data
        chmod 700 /var/lib/postgresql/data
        gosu postgres pg_basebackup -h replication-db -U postgres -D /var/lib/postgresql/data -R -X stream -C -S stellytics_standby
        exec docker-entrypoint.sh postgres
    depends_on:
      replication-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 30s

  replication-monitor:
    image: stellytics-replication-monitor:test
    environment:
      PGHOST: replication-db
      PGUSER: stellytics_replication_monitor
      PGDATABASE: postgres
      PGSSLMODE: disable
      REPLICATION_SLOT: stellytics_standby
    depends_on:
      replication-db:
        condition: service_healthy
