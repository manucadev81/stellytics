# Alta disponibilidade, lado do PRIMÁRIO (#52, ADR 0009, degraus 1 e 2). Override
# opcional do prod.yaml; sem ele (o padrão) a produção é a mesma de antes:
#   docker compose -f prod.yaml -f prod-ha-primary.yaml up -d --wait
#
# O que muda:
# - o Postgres passa a atender a rede privada (HA_PRIVATE_IP, 10.50.0.10 na
#   IaC) em 5432, para a réplica (replicação em streaming) e para os gateways
#   das VMs de ingestão (usuário stellytics_ingest, só lê ingest_site);
# - o Umami passa a atender a mesma rede privada em 3000, porque os gateways
#   das réplicas repassam os eventos para ele. Continua sem rota no Caddy e sem
#   porta na interface pública (#62): só quem está na rede privada alcança.
# - recebe a senha do papel de replicação, que o init/03-replication.sh usa
#   (volume novo) ou que se aplica a um volume existente, ver docs/deploy.md.
#
# Proteção real (não é só "os papéis"): o pg_hba.conf da imagem termina em
# `host all all all scram-sha-256`, que deixaria todos os papéis (postgres,
# umami, stellytics, stellytics_collector) alcançáveis pela rede privada só com senha.
# O init/03-replication.sh insere ANTES dela, para cada faixa de
# REPLICATION_ALLOWED_CIDR: stellytics_ingest só no banco stellytics, replicator só em
# replicação e `reject` para o resto. O tráfego do próprio Compose (portal,
# Umami, gateway local) vem de 172.30.0.0/24, fora dessas faixas.
#
# RISCO que continua: o Umami publicado no IP privado (3000) é alcançável por
# qualquer host da rede privada, sem autenticação em /api/send, e aceita o
# cabeçalho de IP do cliente (CLIENT_IP_HEADER). Quem controlar uma VM da rede
# privada pode injetar eventos com IP falso. Mitigação: o firewall da Hetzner
# deve liberar a 3000 e a 5432 só entre os IPs privados conhecidos (primário,
# réplica e VMs de ingestão); o firewall do projeto não filtra a rede privada
# por padrão (infra/opentofu não faz isso hoje).

services:
  postgres:
    environment:
      REPLICATION_DB_PASSWORD: ${REPLICATION_DB_PASSWORD:?}
      REPLICATION_MONITOR_PASSWORD: ${REPLICATION_MONITOR_PASSWORD:-}
      REPLICATION_MONITOR_CIDR: ${REPLICATION_MONITOR_CIDR:-10.50.0.40/32}
      REPLICATION_ALLOWED_CIDR: ${REPLICATION_ALLOWED_CIDR:-10.50.0.0/16}
      REPLICATION_MAX_SLOT_WAL_KEEP: ${REPLICATION_MAX_SLOT_WAL_KEEP:-10GB}
    ports:
      - "${HA_PRIVATE_IP:?}:${HA_POSTGRES_PORT:-5432}:5432"

  umami:
    ports:
      - "${HA_PRIVATE_IP:?}:${HA_UMAMI_PORT:-3000}:3000"
