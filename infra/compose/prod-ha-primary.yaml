# Alta disponibilidade, lado do PRIMÁRIO (#52, ADR 0009, degraus 1 e 2). Override
# opcional do prod.yaml; sem ele (o padrão) a produção é a mesma de antes:
#   docker compose -f prod.yaml -f prod-ha-primary.yaml up -d --wait
#
# O que muda:
# - o Postgres passa a atender a rede privada (HA_PRIVATE_IP, 10.50.0.10 na
#   IaC) em 5432, para a réplica (replicação em streaming) e para os gateways
#   das VMs de ingestão (usuário notify_ingest, só lê ingest_site);
# - o Umami passa a atender a mesma rede privada em 3000, porque os gateways
#   das réplicas repassam os eventos para ele. Continua sem rota no Caddy e sem
#   porta na interface pública (#62): só quem está na rede privada alcança.
# - recebe a senha do papel de replicação, que o init/03-replication.sh usa
#   (volume novo) ou que se aplica a um volume existente, ver docs/deploy.md.
#
# A rede privada da Hetzner só leva tráfego entre as VMs do projeto; o firewall
# da Hetzner não filtra esse tráfego, então as portas só valem pela rede e
# pelos papéis do banco (notify_ingest só lê a visão ingest_site; replicator só
# replica, e só da faixa REPLICATION_ALLOWED_CIDR no pg_hba.conf).

services:
  postgres:
    environment:
      REPLICATION_DB_PASSWORD: ${REPLICATION_DB_PASSWORD:?}
      REPLICATION_ALLOWED_CIDR: ${REPLICATION_ALLOWED_CIDR:-10.50.0.0/16}
      REPLICATION_MAX_SLOT_WAL_KEEP: ${REPLICATION_MAX_SLOT_WAL_KEEP:-10GB}
    ports:
      - "${HA_PRIVATE_IP:?}:${HA_POSTGRES_PORT:-5432}:5432"

  umami:
    ports:
      - "${HA_PRIVATE_IP:?}:${HA_UMAMI_PORT:-3000}:3000"
