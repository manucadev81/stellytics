# Alta disponibilidade, VM da RÉPLICA do Postgres (#52, ADR 0009, degrau 2).
# Só o Postgres, em modo hot standby, copiando o primário pela rede privada:
#   docker compose -f prod-standby.yaml up -d --build --wait
# Fica somente leitura até uma promoção MANUAL (docs/runbooks/failover-do-banco.md).
#
# Backup: a réplica NÃO faz backup base nem agenda o notify-backup (o timer é do
# primário). Enquanto é réplica o Postgres não arquiva WAL (archive_mode=on só
# arquiva no primário). As variáveis do WAL-G ficam aqui para a réplica promovida
# já arquivar para o mesmo prefixo, e o notify-backup funcionar nela depois.
#
# Mesmo diretório de dados do prod.yaml (${NOTIFY_DATA_DIR}/postgres): depois da
# promoção, dá para trocar este arquivo pelo prod.yaml na mesma VM.

name: notify-standby

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    build:
      context: ./postgres
    image: notify-postgres-walg:17.11-walg3.0.9
    entrypoint: ["/usr/local/bin/notify-standby-entrypoint"]
    environment:
      POSTGRES_USER: postgres
      # O cluster vem do primário (senhas inclusive); a variável só satisfaz o
      # entrypoint da imagem e não é usada.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      PRIMARY_HOST: ${PRIMARY_HOST:?}
      PRIMARY_PORT: ${PRIMARY_PORT:-5432}
      REPLICATOR_PASSWORD: ${REPLICATION_DB_PASSWORD:?}
      REPLICATION_SLOT: ${REPLICATION_SLOT:-notify_standby}
      WALG_S3_PREFIX: ${WALG_S3_PREFIX:?}
      AWS_ENDPOINT: ${WALG_S3_ENDPOINT:?}
      AWS_REGION: ${WALG_S3_REGION:?}
      AWS_ACCESS_KEY_ID: ${WALG_S3_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${WALG_S3_SECRET_KEY:?}
      AWS_S3_FORCE_PATH_STYLE: "true"
      WALG_LIBSODIUM_KEY: ${WALG_LIBSODIUM_KEY:?}
      WALG_LIBSODIUM_KEY_TRANSFORM: hex
      WALG_COMPRESSION_METHOD: brotli
      PGHOST: /var/run/postgresql
      PGUSER: postgres
    # Os mesmos parâmetros do prod.yaml (max_connections e afins da réplica
    # nunca podem ser menores que os do primário).
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=wal-g wal-push %p
      - -c
      - archive_timeout=60
      - -c
      - hot_standby=on
    volumes:
      - ${NOTIFY_DATA_DIR:-/srv/notify}/postgres:/var/lib/postgresql/data
      - ./postgres/standby-entrypoint.sh:/usr/local/bin/notify-standby-entrypoint:ro
    ports:
      # Só o loopback da VM (túnel SSH de administração).
      - "127.0.0.1:${POSTGRES_ADMIN_PORT:-5432}:5432"
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notify"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    logging: *logging
