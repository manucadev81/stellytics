# Só para test/ha-replication-test.sh (e o job `infra` do CI). Em cima de
# prod.yaml + prod-ha-primary.yaml + prod-test.yaml: rede e IPs que não colidem
# com a pilha de produção do outro teste, e um apelido estável para o primário.
# Nunca use em produção.

services:
  postgres:
    networks:
      internal:
        aliases: [pg-primary]

networks:
  internal:
    ipam:
      config: !override
        - subnet: 172.31.52.0/24
        - subnet: fd31:6e6f:5200::/64
