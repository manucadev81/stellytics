# Só para test/ha-replication-test.sh. Em cima de prod-standby.yaml: junta o
# Postgres à rede do primário do teste (TEST_NET) em vez de criar a própria, e
# publica a porta de teste no loopback.

services:
  postgres:
    networks: !override
      internal: {}
    ports: !override
      - "127.0.0.1:${TEST_PG_PORT:-15454}:5432"

networks:
  internal: !override
    external: true
    name: ${TEST_NET:?}
