# Só para test/ha-replication-test.sh. Em cima de prod-ingest.yaml: junta o
# gateway à rede do primário do teste (TEST_NET) e publica a porta de teste no
# loopback. Sobe só o ingest-web (o Caddy precisa das portas 80 e 443).

services:
  ingest-web:
    networks: !override
      internal: {}
    ports:
      - "127.0.0.1:${TEST_INGEST_PORT:-18081}:8080"

  caddy:
    networks: !override
      internal: {}
    ports: !override
      - "127.0.0.1:${TEST_CADDY_HTTPS:-18443}:443"

networks:
  internal: !override
    external: true
    name: ${TEST_NET:?}
