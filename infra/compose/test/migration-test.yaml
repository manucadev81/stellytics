# Só para o teste da migração de dados (test/data-migration-test.sh, #54).
# Vai por cima de prod.yaml e prod-test.yaml e deixa duas pilhas (origem e
# destino) rodarem lado a lado na mesma máquina: tira os IPs fixos da rede
# (o Caddy, que os usa, não sobe neste teste) e publica no loopback só o que o
# teste alcança de fora. Nunca use em produção.

services:
  umami:
    networks: !override [internal]
  s3:
    ports:
      - "127.0.0.1:${S3_PORT:?}:8333"
  portal:
    ports:
      - "127.0.0.1:${PORTAL_PORT:?}:3000"

networks:
  internal: !override
    driver: bridge
