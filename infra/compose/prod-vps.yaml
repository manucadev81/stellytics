# Instalação enxuta para uma VPS: portal, gateway web, coletor OTLP, Umami,
# consolidação de métricas, Postgres e Caddy. Os dados ficam em volumes Docker
# locais; este arquivo não configura backup externo.
name: stellytics-vps

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 10

services:
  postgres:
    image: postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD em .env.production}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:?configure UMAMI_DB_PASSWORD em .env.production}
      STELLYTICS_DB_PASSWORD: ${STELLYTICS_DB_PASSWORD:?configure STELLYTICS_DB_PASSWORD em .env.production}
      STELLYTICS_INGEST_DB_PASSWORD: ${STELLYTICS_INGEST_DB_PASSWORD:?configure STELLYTICS_INGEST_DB_PASSWORD em .env.production}
      STELLYTICS_COLLECTOR_DB_PASSWORD: ${STELLYTICS_COLLECTOR_DB_PASSWORD:?configure STELLYTICS_COLLECTOR_DB_PASSWORD em .env.production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_ADMIN_PORT:-5432}:5432"
    shm_size: 256mb
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres && pg_isready -U postgres -d umami"]
    <<: *service-defaults
    networks: [internal]

  umami:
    image: ghcr.io/umami-software/umami:3.4.1@sha256:e69d1a7932e9dab0fc523edc7be1f3a53f3c261f57856fc2167ae74a8fc022e8
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?configure UMAMI_APP_SECRET em .env.production}
      DISABLE_TELEMETRY: "1"
      CLIENT_IP_HEADER: x-stellytics-client-ip
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/heartbeat"]
      retries: 20
      start_period: 30s
    <<: *service-defaults
    networks:
      internal:
        ipv4_address: 172.30.0.20

  portal:
    build:
      context: ../..
      dockerfile: apps/portal/Dockerfile
    image: stellytics-portal:vps
    environment:
      DATABASE_URL: postgresql://stellytics:${STELLYTICS_DB_PASSWORD:?}@postgres:5432/stellytics
      BETTER_AUTH_SECRET: ${PORTAL_AUTH_SECRET:?configure PORTAL_AUTH_SECRET em .env.production}
      BETTER_AUTH_URL: https://${PORTAL_HOST:?configure PORTAL_HOST em .env.production}
      RUN_MIGRATIONS: "true"
      UMAMI_URL: http://umami:3000
      UMAMI_API_KEY: ${UMAMI_API_KEY:-}
      SMTP_URL: ${SMTP_URL:?configure SMTP_URL em .env.production}
      MAIL_FROM: ${MAIL_FROM:?configure MAIL_FROM em .env.production}
      SIGNUP_APPROVAL: ${SIGNUP_APPROVAL:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/auth/ok >/dev/null"]
      retries: 20
      start_period: 30s
    <<: *service-defaults
    networks: [internal]

  ingest-web:
    build:
      context: ../..
      dockerfile: services/ingest-web/Dockerfile
    image: stellytics-ingest-web:vps
    environment:
      DATABASE_URL: postgresql://stellytics_ingest:${STELLYTICS_INGEST_DB_PASSWORD:?}@postgres:5432/stellytics
      UMAMI_URL: http://umami:3000
      CLIENT_IP_HEADER: x-stellytics-client-ip
      TRUSTED_PROXIES: 172.30.0.10
      PROOF_SECRET: ${INGEST_PROOF_SECRET:?configure INGEST_PROOF_SECRET em .env.production}
      RATE_LIMIT: ${INGEST_RATE_LIMIT:-20}
      RATE_BURST: ${INGEST_RATE_BURST:-40}
      FINGERPRINT_LIMIT: ${INGEST_FINGERPRINT_LIMIT:-50}
      SITE_STALE_TTL: ${INGEST_SITE_STALE_TTL:-0}
      RELAY_MAX_INFLIGHT: ${INGEST_RELAY_MAX_INFLIGHT:-0}
      RELAY_QUEUE_WAIT: ${INGEST_RELAY_QUEUE_WAIT:-250ms}
    depends_on:
      postgres:
        condition: service_healthy
      umami:
        condition: service_healthy
      portal:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/ingest-web", "-healthcheck"]
      start_period: 5s
    <<: *service-defaults
    networks: [internal]

  collector:
    build:
      context: ../..
      dockerfile: services/collector/Dockerfile
    image: stellytics-collector:vps
    environment:
      DATABASE_URL: postgresql://stellytics_collector:${STELLYTICS_COLLECTOR_DB_PASSWORD:?}@postgres:5432/stellytics
      INGEST_KEY_CACHE_TTL: ${COLLECTOR_KEY_CACHE_TTL:-60s}
    mem_limit: ${COLLECTOR_MEM_LIMIT:-512m}
    depends_on:
      postgres:
        condition: service_healthy
      portal:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/healthcheck"]
      start_period: 5s
    <<: *service-defaults
    networks: [internal]

  rollup:
    build:
      context: ../..
      dockerfile: services/rollup/Dockerfile
    image: stellytics-rollup:vps
    environment:
      DATABASE_URL: postgresql://stellytics:${STELLYTICS_DB_PASSWORD:?}@postgres:5432/stellytics
      ROLLUP_INTERVAL: ${ROLLUP_INTERVAL:-15m}
      ROLLUP_LOOKBACK: ${ROLLUP_LOOKBACK:-48h}
      UMAMI_DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?}@postgres:5432/umami
      UMAMI_RETENTION_DAYS: ${UMAMI_RETENTION_DAYS:-183}
    depends_on:
      postgres:
        condition: service_healthy
      portal:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/rollup", "-healthcheck"]
      start_period: 5s
    <<: *service-defaults
    networks: [internal]

  caddy:
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    environment:
      PORTAL_HOST: ${PORTAL_HOST:?configure PORTAL_HOST em .env.production}
      PORTAL_ALIAS_HOST: ${PORTAL_ALIAS_HOST:?configure PORTAL_ALIAS_HOST em .env.production}
      INGEST_HOST: ${INGEST_HOST:?configure INGEST_HOST em .env.production}
      API_HOST: ${API_HOST:?configure API_HOST em .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?configure ACME_EMAIL em .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      portal:
        condition: service_healthy
      ingest-web:
        condition: service_healthy
      collector:
        condition: service_healthy
    <<: *service-defaults
    networks:
      internal:
        ipv4_address: 172.30.0.10

networks:
  internal:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
        - subnet: fd30:6e6f:7466::/64

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
