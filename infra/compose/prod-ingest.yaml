# Alta disponibilidade, VM de INGESTÃO extra (#52, ADR 0009, degrau 1): só o
# gateway web e o Caddy, sem banco, portal nem Umami. Sobe com:
#   docker compose -f prod-ingest.yaml up -d --wait
#
# O gateway lê `ingest_site` do Postgres do PRIMÁRIO e repassa os eventos ao
# Umami do primário, os dois pela rede privada (prod-ha-primary.yaml do lado de
# lá). Todas as réplicas e o primário precisam do MESMO INGEST_PROOF_SECRET: a
# prova de JS é um token assinado e qualquer réplica valida o de outra. Os
# limites por IP e por fingerprint são por instância (ADR 0009).
#
# Mesmas imagens, por digest e conferidas com cosign pelo Ansible, e a mesma
# rede interna do prod.yaml (o Caddy mantém o IP fixo que TRUSTED_PROXIES usa).

name: stellytics-ingest

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  ingest-web:
    image: ${INGEST_WEB_IMAGE:?}
    environment:
      DATABASE_URL: postgresql://stellytics_ingest:${STELLYTICS_INGEST_DB_PASSWORD:?}@${DB_HOST:?}:${DB_PORT:-5432}/stellytics
      UMAMI_URL: http://${UMAMI_HOST:?}:${UMAMI_PORT:-3000}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-x-stellytics-client-ip}
      TRUSTED_PROXIES: 172.30.0.10,fd30:6e6f:7466::10
      PROOF_SECRET: ${INGEST_PROOF_SECRET:?}
      RATE_LIMIT: ${INGEST_RATE_LIMIT:-20}
      RATE_BURST: ${INGEST_RATE_BURST:-40}
      FINGERPRINT_LIMIT: ${INGEST_FINGERPRINT_LIMIT:-50}
      # Desligados por padrão (docs/deploy.md). Não ligue o limite de repasses
      # antes de decidir o 503 sob saturação (ADR 0011).
      SITE_STALE_TTL: ${INGEST_SITE_STALE_TTL:-0}
      RELAY_MAX_INFLIGHT: ${INGEST_RELAY_MAX_INFLIGHT:-0}
      RELAY_QUEUE_WAIT: ${INGEST_RELAY_QUEUE_WAIT:-250ms}
    healthcheck:
      test: ["CMD", "/ingest-web", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging: *logging
    networks: [internal]

  caddy:
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.ingest", "--adapter", "caddyfile"]
    environment:
      INGEST_HOST: ${INGEST_HOST:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # A pasta, não o arquivo (o Ansible troca arquivos por renomeação).
      - ../caddy:/etc/caddy:ro
      - ${STELLYTICS_DATA_DIR:-/srv/stellytics}/caddy:/data
    depends_on:
      ingest-web:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    networks:
      internal:
        ipv4_address: 172.30.0.10
        ipv6_address: fd30:6e6f:7466::10

networks:
  internal:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
        - subnet: fd30:6e6f:7466::/64
