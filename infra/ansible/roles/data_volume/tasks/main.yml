# Volume da Hetzner com os dados (criado em ext4 pelo OpenTofu), montado em
# /srv/stellytics. Sobrevive se a VM for recriada.
- name: Confere o volume de dados
  ansible.builtin.stat:
    path: "{{ data_volume_device }}"
  register: data_volume_device_stat
  failed_when: not data_volume_device_stat.stat.exists

- name: Pasta de montagem
  ansible.builtin.file:
    path: "{{ stellytics_data_dir }}"
    state: directory
    mode: "0755"

# A instalação anterior montava o mesmo volume em /srv/notify. Pare o projeto
# Compose que usa esse ponto antes de desmontá-lo; caso contrário o novo mount
# falha e a atualização deixa as duas pilhas disputando as portas públicas.
- name: Detecta o volume montado no caminho legado
  ansible.builtin.command: findmnt -n --mountpoint {{ data_volume_legacy_notify_data_dir }}
  register: data_volume_legacy_notify_mount
  changed_when: false
  failed_when: false

- name: Para a pilha legada antes de mover o volume
  ansible.builtin.command:
    cmd: docker compose -p notify -f prod.yaml down --remove-orphans
    chdir: "{{ data_volume_legacy_notify_root }}/infra/compose"
  when: data_volume_legacy_notify_mount.rc == 0
  changed_when: true

- name: Remove a montagem legada do fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '\s{{ data_volume_legacy_notify_data_dir }}\s'
    state: absent
  when: data_volume_legacy_notify_mount.rc == 0

- name: Desmonta o volume do caminho legado
  ansible.builtin.command: umount {{ data_volume_legacy_notify_data_dir }}
  when: data_volume_legacy_notify_mount.rc == 0
  changed_when: true

- name: Monta o volume na subida da VM
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '\s{{ stellytics_data_dir }}\s'
    line: "{{ data_volume_device }} {{ stellytics_data_dir }} ext4 discard,nofail,defaults 0 0"
  register: data_volume_fstab

# Sem o módulo mount de propósito: ele exige a coleção ansible.posix, e o
# deploy usa só ansible.builtin.
- name: Monta o volume agora
  ansible.builtin.command: mount {{ stellytics_data_dir }}  # noqa: command-instead-of-module
  when: data_volume_fstab.changed or not (ansible_facts['mounts'] | selectattr('mount', 'equalto', stellytics_data_dir) | list)
  changed_when: true

- name: Confere que /srv/stellytics é o volume certo (e não a pasta no disco da VM)
  ansible.builtin.shell: |
    set -o pipefail
    [ "$(findmnt -n -o SOURCE --mountpoint {{ stellytics_data_dir }} | xargs -r readlink -f)" = "$(readlink -f {{ data_volume_device }})" ]
  args:
    executable: /bin/bash
  changed_when: false

# Com nofail, a VM sobe mesmo sem o volume; o Docker e o backup não. Sem isso,
# o Postgres criaria um banco vazio no disco da VM e a retenção do backup
# acabaria apagando os backups bons.
- name: Pasta de ajustes do serviço do Docker
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"

- name: Docker só sobe com o volume montado
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/10-stellytics-data.conf
    content: |
      [Unit]
      RequiresMountsFor={{ stellytics_data_dir }}
    mode: "0644"
  notify: Recarrega o systemd (volume)
