# Backup base diário do Postgres (o WAL vai continuamente pelo archive_command).
- name: Serviço do backup
  ansible.builtin.template:
    src: stellytics-backup.service.j2
    dest: /etc/systemd/system/stellytics-backup.service
    mode: "0644"
  notify: Recarrega o systemd

- name: Timer do backup
  ansible.builtin.template:
    src: stellytics-backup.timer.j2
    dest: /etc/systemd/system/stellytics-backup.timer
    mode: "0644"
  notify: Recarrega o systemd

- name: Aplica os arquivos do systemd agora
  ansible.builtin.meta: flush_handlers

- name: Descobre se o timer de backup legado existe
  ansible.builtin.command: systemctl show notify-backup.timer --property=LoadState --value
  register: legacy_notify_backup_timer
  changed_when: false
  failed_when: legacy_notify_backup_timer.rc != 0

- name: Desliga o timer de backup legado
  ansible.builtin.systemd_service:
    name: notify-backup.timer
    state: stopped
    enabled: false
  when: legacy_notify_backup_timer.stdout | trim not in ['', 'not-found']

- name: Timer ligado
  ansible.builtin.systemd_service:
    name: stellytics-backup.timer
    state: started
    enabled: true
