# Réplica do Postgres (#52, ADR 0009, degrau 2): hot standby por replicação em
# streaming, copiada do primário pela rede privada. Sem backup base aqui: o
# timer do stellytics-backup é só do primário (papel `backup` não entra no standby.yml).
- name: Pastas da aplicação
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ stellytics_root }}/infra/compose/postgres"

- name: Copia o Compose da réplica, a imagem do Postgres com WAL-G e a entrada da réplica
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../{{ item.src }}"
    dest: "{{ stellytics_root }}/infra/{{ item.src }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - { src: compose/prod-standby.yaml }
    - { src: compose/postgres/Dockerfile }
    - { src: compose/postgres/backup.sh, mode: "0755" }
    - { src: compose/postgres/restore.sh, mode: "0755" }
    - { src: compose/postgres/standby-entrypoint.sh, mode: "0755" }

- name: Segredos e configuração da réplica (.env)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ stellytics_root }}/infra/compose/.env"
    mode: "0600"
  no_log: true

- name: Sobe a réplica
  ansible.builtin.command:
    cmd: docker compose -f prod-standby.yaml up -d --build --wait --wait-timeout 1800 --remove-orphans
    chdir: "{{ stellytics_root }}/infra/compose"
  register: postgres_standby_up
  changed_when: "'Started' in postgres_standby_up.stderr or 'Recreated' in postgres_standby_up.stderr or 'Created' in postgres_standby_up.stderr"

- name: Confere que o Postgres está em modo réplica
  ansible.builtin.command:
    cmd: docker compose -f prod-standby.yaml exec -T postgres psql -U postgres -d postgres -Atc "SELECT pg_is_in_recovery()"
    chdir: "{{ stellytics_root }}/infra/compose"
  register: postgres_standby_recovery
  changed_when: false
  failed_when: postgres_standby_recovery.stdout | trim != 't'
