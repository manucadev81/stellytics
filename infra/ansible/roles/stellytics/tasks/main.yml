# Aplicação: arquivos do Compose, .env com os segredos, imagens conferidas com
# cosign e a pilha no ar.
- name: Pastas da aplicação
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ stellytics_root }}/infra/compose/postgres/init"
    - "{{ stellytics_root }}/infra/caddy"
    - "{{ stellytics_root }}/infra/scripts"

- name: Copia o Compose, o Postgres com WAL-G, o Caddyfile e os scripts de migração do repositório
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../{{ item.src }}"
    dest: "{{ stellytics_root }}/infra/{{ item.src }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - { src: compose/prod.yaml }
    - { src: compose/postgres/Dockerfile }
    - { src: compose/postgres/backup.sh, mode: "0755" }
    - { src: compose/postgres/restore.sh, mode: "0755" }
    - { src: compose/postgres/init/01-databases.sh, mode: "0755" }
    - { src: compose/postgres/init/02-ingest-roles.sh, mode: "0755" }
    - { src: caddy/Caddyfile }
    # Migração de dados entre operadores (docs/transferencia.md, #54).
    - { src: scripts/db-export.sh, mode: "0755" }
    - { src: scripts/db-import.sh, mode: "0755" }
    - { src: scripts/db-fingerprint.sh, mode: "0755" }
  register: stellytics_files

# Alta disponibilidade (#52, ADR 0009): só quando ha_replication é true. Com o
# padrão (false) nenhum arquivo, variável nem comando abaixo muda.
- name: Arquivos de alta disponibilidade do primário (replicação do Postgres)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../{{ item.src }}"
    dest: "{{ stellytics_root }}/infra/{{ item.src }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - { src: compose/prod-ha-primary.yaml }
    - { src: compose/postgres/init/03-replication.sh, mode: "0755" }
  when: ha_replication | default(false) | bool

- name: Segredos e configuração da pilha (.env)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ stellytics_root }}/infra/compose/.env"
    mode: "0600"
  no_log: true

- name: Confere a assinatura das imagens (cosign)
  ansible.builtin.command: >-
    cosign verify {{ item }}
    --certificate-identity-regexp '{{ cosign_identity_regexp }}'
    --certificate-oidc-issuer {{ cosign_oidc_issuer }}
  loop:
    - "{{ portal_image }}"
    - "{{ ingest_web_image }}"
    - "{{ collector_image }}"
    - "{{ rollup_image }}"
  changed_when: false
  tags: [images]

# Começa somente o banco para que uma instalação existente possa trocar os
# nomes do banco e dos papéis antes de portal, gateway, coletor e rollup
# tentarem usar as credenciais novas.
- name: Sobe o Postgres antes da migração de marca
  ansible.builtin.command:
    cmd: "docker compose {{ stellytics_compose_files }} up -d --build --wait postgres"
    chdir: "{{ stellytics_root }}/infra/compose"
  register: stellytics_postgres_up
  changed_when: "'Started' in stellytics_postgres_up.stderr or 'Recreated' in stellytics_postgres_up.stderr or 'Created' in stellytics_postgres_up.stderr"
  tags: [images]

- name: Migra os nomes do banco e dos papéis da instalação notify
  ansible.builtin.shell: |
    set -euo pipefail
    compose='docker compose {{ stellytics_compose_files }}'
    pg() { $compose exec -T -u postgres postgres psql -X -v ON_ERROR_STOP=1 "$@"; }
    exists_database() { pg -d postgres -Atc "select 1 from pg_database where datname = '$1'" | grep -qx 1; }
    exists_role() { pg -d postgres -Atc "select 1 from pg_roles where rolname = '$1'" | grep -qx 1; }

    # Validate all old/new pairs before changing anything. Then apply each
    # rename independently so a rerun can resume after an interrupted deploy.
    if exists_database notify && exists_database stellytics; then
      echo 'conflito: os bancos notify e stellytics existem; resolva manualmente' >&2; exit 1
    fi
    for pair in notify:stellytics notify_ingest:stellytics_ingest notify_collector:stellytics_collector; do
      old=${pair%%:*}; new=${pair##*:}
      if exists_role "$old" && exists_role "$new"; then
        echo "conflito: os papéis $old e $new existem; resolva manualmente" >&2; exit 1
      fi
    done

    changed=0
    if exists_database notify; then
      pg -d postgres -c 'ALTER DATABASE notify RENAME TO stellytics'; changed=1
    fi
    for pair in notify:stellytics notify_ingest:stellytics_ingest notify_collector:stellytics_collector; do
      old=${pair%%:*}; new=${pair##*:}
      if exists_role "$old"; then
        pg -d postgres -c "ALTER ROLE \"$old\" RENAME TO \"$new\""; changed=1
      fi
    done

    db_pw=$($compose exec -T postgres printenv STELLYTICS_DB_PASSWORD)
    if exists_role stellytics; then
      pg -d postgres -v db_pw="$db_pw" -c "ALTER ROLE stellytics PASSWORD :'db_pw'"
    fi
    $compose exec -T -u postgres postgres sh < postgres/init/02-ingest-roles.sh
    if [ "$changed" = 1 ]; then echo 'notify-to-stellytics: changed'; fi
  args:
    chdir: "{{ stellytics_root }}/infra/compose"
    executable: /bin/bash
  register: stellytics_brand_migration
  changed_when: "'notify-to-stellytics: changed' in stellytics_brand_migration.stdout"
  no_log: true
  tags: [images]

- name: Sobe a pilha
  ansible.builtin.command:
    cmd: "docker compose {{ stellytics_compose_files }} up -d --build --wait --remove-orphans"
    chdir: "{{ stellytics_root }}/infra/compose"
  tags: [images]
  register: stellytics_compose_up
  changed_when: "'Started' in stellytics_compose_up.stderr or 'Recreated' in stellytics_compose_up.stderr or 'Created' in stellytics_compose_up.stderr"

# Papel de replicação, slot e pg_hba num volume que já existe (num volume novo o
# init do Postgres já rodou o mesmo script). Idempotente.
- name: Prepara o primário para a réplica (papel, slot e pg_hba)
  ansible.builtin.shell:
    cmd: "docker compose {{ stellytics_compose_files }} exec -T postgres sh < {{ stellytics_root }}/infra/compose/postgres/init/03-replication.sh"
    chdir: "{{ stellytics_root }}/infra/compose"
  when: ha_replication | default(false) | bool
  register: stellytics_ha_prepare
  # O script imprime "03-replication: changed" só quando alterou o pg_hba.conf.
  changed_when: "'03-replication: changed' in stellytics_ha_prepare.stdout"
  no_log: true
  tags: [images]

# O Caddy não relê o Caddyfile sozinho; recarrega sem derrubar conexões.
- name: Recarrega o Caddy se o Caddyfile mudou
  ansible.builtin.command:
    cmd: "docker compose {{ stellytics_compose_files }} exec -T caddy caddy reload --config /etc/caddy/Caddyfile"
    chdir: "{{ stellytics_root }}/infra/compose"
  when: stellytics_files.results | selectattr('item.src', 'equalto', 'caddy/Caddyfile') | selectattr('changed') | list | length > 0
  changed_when: true
  tags: [images]
