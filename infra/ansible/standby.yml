# Réplica do Postgres (#52, ADR 0009, degrau 2). Uso, de infra/ansible, DEPOIS de
# `site.yml` com ha_replication: true no primário:
#   ansible-playbook standby.yml -e @secrets.yml
# A promoção é manual: docs/runbooks/failover-do-banco.md.
- name: Réplica do Postgres do notify
  hosts: standby
  become: true
  pre_tasks:
    - name: Confere os segredos obrigatórios
      ansible.builtin.assert:
        that:
          - item is defined
          - item | length > 0
        fail_msg: "Falta um segredo em secrets.yml (veja secrets.example.yml)."
        quiet: true
      loop:
        - "{{ postgres_password | default('') }}"
        - "{{ replicator_db_password | default('') }}"
        - "{{ walg_s3_access_key | default('') }}"
        - "{{ walg_s3_secret_key | default('') }}"
        - "{{ walg_libsodium_key | default('') }}"
      no_log: true

  roles:
    - base
    - docker
    - data_volume
    - postgres_standby
