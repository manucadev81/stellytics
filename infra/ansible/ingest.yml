# VMs de ingestão extras (#52, ADR 0009, degrau 1). Uso, de infra/ansible:
#   ansible-playbook ingest.yml -e @secrets.yml
# Só gateway web e Caddy; o banco e o Umami são os do primário (ha_replication
# ligado em site.yml). Mesmo ingest_proof_secret do primário, obrigatoriamente.
- name: Ingestão extra do stellytics
  hosts: ingest
  become: true
  pre_tasks:
    - name: Confere os segredos obrigatórios
      ansible.builtin.assert:
        that:
          - item is defined
          - item | length > 0
        fail_msg: "Falta um segredo em secrets.yml (veja secrets.example.yml)."
        quiet: true
      loop:
        - "{{ stellytics_ingest_db_password | default('') }}"
        - "{{ ingest_proof_secret | default('') }}"
      no_log: true

    - name: Confere que a imagem vai por digest
      ansible.builtin.assert:
        that: ingest_web_image is regex('@sha256:[0-9a-f]{64}$')
        fail_msg: "ingest_web_image precisa terminar em @sha256:<digest> (a mesma do primário)."
        quiet: true

  roles:
    - base
    - docker
    - stellytics_ingest
