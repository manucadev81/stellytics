# Deploy completo e idempotente da VM de produção (#14, ADR 0004).
- name: Produção do stellytics
  hosts: stellytics
  become: true
  pre_tasks:
    - name: Confere os segredos obrigatórios
      ansible.builtin.assert:
        that:
          - item is defined
          - item | length > 0
        fail_msg: "Falta um segredo em secrets.yml (veja secrets.example.yml)."
        quiet: true
      loop:
        - "{{ postgres_password | default('') }}"
        - "{{ umami_db_password | default('') }}"
        - "{{ stellytics_db_password | default('') }}"
        - "{{ stellytics_ingest_db_password | default('') }}"
        - "{{ stellytics_collector_db_password | default('') }}"
        - "{{ umami_app_secret | default('') }}"
        - "{{ portal_auth_secret | default('') }}"
        - "{{ ingest_proof_secret | default('') }}"
        - "{{ smtp_url | default('') }}"
        - "{{ walg_s3_access_key | default('') }}"
        - "{{ walg_s3_secret_key | default('') }}"
        - "{{ walg_libsodium_key | default('') }}"
      no_log: true

    - name: Confere o segredo da replicação (alta disponibilidade ligada)
      ansible.builtin.assert:
        that:
          - replicator_db_password | default('') | length > 0
          - ha_private_ip | default('') | length > 0
        fail_msg: "ha_replication: true exige replicator_db_password em secrets.yml."
        quiet: true
      no_log: true
      when: ha_replication | default(false) | bool

    - name: Confere a chave do backup (32 bytes em hexadecimal)
      ansible.builtin.assert:
        that: walg_libsodium_key is regex('^[0-9a-f]{64}$')
        fail_msg: "walg_libsodium_key precisa ter 64 caracteres hexadecimais (openssl rand -hex 32)."
        quiet: true
      no_log: true

    - name: Confere que as imagens vão por digest
      ansible.builtin.assert:
        that:
          - portal_image is regex('@sha256:[0-9a-f]{64}$')
          - ingest_web_image is regex('@sha256:[0-9a-f]{64}$')
          - collector_image is regex('@sha256:[0-9a-f]{64}$')
          - rollup_image is regex('@sha256:[0-9a-f]{64}$')
        fail_msg: "portal_image, ingest_web_image, collector_image e rollup_image precisam terminar em @sha256:<digest>."
        quiet: true

  roles:
    - base
    - docker
    - data_volume
    - stellytics
    - backup
