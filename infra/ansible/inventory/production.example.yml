# Copie para production.yml (fora do git) e preencha com as saídas do OpenTofu:
#   tofu -chdir=infra/opentofu output
all:
  hosts:
    notify:
      ansible_host: 203.0.113.20          # server_ipv4
      data_volume_device: /dev/disk/by-id/scsi-0HC_Volume_12345678  # data_volume_device
    monitor:
      ansible_host: 203.0.113.30          # monitor_ipv4

  children:
    # Alta disponibilidade (#52, ADR 0009), só se ligada no OpenTofu. As VMs
    # extras de ingestão (ingest.yml) e a réplica do Postgres (standby.yml).
    ingest:
      hosts:
        ingest1:
          ansible_host: 203.0.113.40      # ingest_ipv4[0]
    standby:
      hosts:
        db_standby:
          ansible_host: 203.0.113.50      # IP público da VM notify-db-standby (console da Hetzner; o OpenTofu só exporta o IP privado)
          data_volume_device: /dev/disk/by-id/scsi-0HC_Volume_87654321  # volume notify-data-standby (console da Hetzner)
