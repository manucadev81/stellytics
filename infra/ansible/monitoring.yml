# Monitoramento externo da produção (#15, ADR 0005). Uso, de infra/ansible:
#   ansible-playbook monitoring.yml -e @secrets.yml
- name: Monitoramento do stellytics
  hosts: monitor
  become: true
  pre_tasks:
    - name: Confere a configuração dos alertas
      ansible.builtin.assert:
        that:
          - monitor_alert_email | default('') | length > 0
          - monitor_smtp_smarthost | default('') is regex('^[^:]+:[0-9]+$')
          - monitor_smtp_from | default('') | length > 0
        fail_msg: "Preencha monitor_alert_email, monitor_smtp_smarthost (host:porta) e monitor_smtp_from."
        quiet: true
    - name: Confere a configuração da sonda de replicação
      ansible.builtin.assert:
        that:
          - ha_replication | default(false) | bool
          - replication_monitor_password | default('') is regex('^[0-9a-f]{64}$')
          - monitor_replication_image is regex('@sha256:[0-9a-f]{64}$')
        fail_msg: "A sonda exige HA, senha hexadecimal e imagem assinada por digest."
        quiet: true
      no_log: true
      when: monitor_replication_enabled | default(false) | bool
  roles:
    - base
    - docker
    - monitoring
